<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Meu Financeiro</h1>
            <p class="subtitle">Controle simples de gastos</p>
        </header>

        <!-- Formulário de gasto -->
        <section class="card">
            <h2>➕ Novo Gasto</h2>
            <form id="gastoForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Descrição</label>
                        <input type="text" id="descricao" placeholder="Ex: Almoço, Uber, Mercado..." >
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="valor" step="0.01" min="0.01" placeholder="0,00" >
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="categoria" >
                            <option value="">Selecione...</option>
                            <option value="ALIMENTACAO">🍔 Alimentação</option>
                            <option value="TRANSPORTE">🚌 Transporte</option>
                            <option value="LAZER">🎮 Lazer</option>
                            <option value="OUTROS">📦 Outros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="data" >
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Salvar Gasto</button>
            </form>
        </section>

        <!-- Resumo total -->
        <section class="card resume">
            <h2>📊 Resumo do Mês</h2>
            <div class="resume-grid">
                <div class="resume-item">
                    <span class="resume-label">Total Gasto</span>
                    <span class="resume-value" id="totalGastos">R$ 0,00</span>
                </div>
                <div class="resume-item">
                    <span class="resume-label">Quantidade</span>
                    <span class="resume-value" id="qtdGastos">0</span>
                </div>
            </div>
        </section>

        <!-- Lista de gastos -->
        <section class="card">
            <h2>📋 Meus Gastos</h2>
            <div id="listaGastos" class="lista-gastos">
                <p class="vazio">Nenhum gasto cadastrado ainda.</p>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
