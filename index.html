<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="tab-home" class="tab active">
    <div class="home-header">
        <div class="coins-icon">◈</div>
        <div class="total-display">
            <span class="total-value" id="totalGastos">R$ 0,00</span>
            <span class="total-label"><span id="qtdGastos">0</span> gastos registrados</span>
        </div>
    </div>

    <div class="sheet liquid-glass">
        <div class="sheet-title">Atividade Recente</div>
        <div id="listaGastos" class="lista-gastos">
            <p class="vazio">Nenhum gasto cadastrado ainda.</p>
        </div>
    </div>
</div>

<div id="tab-chart" class="tab">
    <div class="sheet sheet--full liquid-glass" style="margin-top:16px;">
        <div class="sheet-title">Gastos por Categoria</div>
        <canvas id="graficoGastos"></canvas>
        <div id="graficoVazio" class="vazio" style="display:none">Nenhum dado para exibir.</div>
    </div>
</div>

<div id="modal" class="modal-overlay" style="display:none"">
    <div class="modal-box liquid-glass">
        <div class="modal-handle" onclick="fecharModal()"></div>
        <div class="modal-title">Novo Gasto</div>
        <form id="gastoForm">
            <div class="field-group">
                <label>Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Almoço, Uber...">
            </div>
            <div class="field-group">
                <label>Valor (R$)</label>
                <input type="number" id="valor" step="0.01" min="0.01" placeholder="0,00">
            </div>
            <div class="field-row">
                <div class="field-group">
                    <label>Categoria</label>
                    <select id="categoria">
                        <option value="">Selecione...</option>
                        <option value="ALIMENTACAO">🍔 Alimentação</option>
                        <option value="TRANSPORTE">🚌 Transporte</option>
                        <option value="LAZER">🎮 Lazer</option>
                        <option value="OUTROS">📦 Outros</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Data</label>
                    <input type="date" id="data">
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn-save">Salvar</button>
            </div>
        </form>
    </div>
</div>

<nav class="bottom-nav liquid-glass">
    <button class="nav-btn active" onclick="trocarAba('home', this)">
        <span class="nav-icon">⌂</span>
        <span class="nav-label">Início</span>
    </button>
    <button class="nav-btn" onclick="trocarAba('chart', this)">
        <span class="nav-icon">◱</span>
        <span class="nav-label">Métricas</span>
    </button>
    <button class="nav-fab" onclick="abrirModal()">＋</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>
</body>
</html>
